
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump House Auctions | Specialists in Fine Art & Antiques</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/images/logo-light.png">
    <link rel="apple-touch-icon" href="/images/logo-light.png">
    <meta name="description" content="Pump House Specialist Auctions — a family-owned auction house in Hampshire holding two specialist sales each month in fine art, antiques, jewellery, watches and silver.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      // Configure Tailwind once it's loaded
      document.addEventListener('DOMContentLoaded', () => {
        if (window.tailwind) {
          tailwind.config = {
            theme: {
              extend: {
                fontFamily: {
                  serif: ['"Playfair Display"', 'serif'],
                  sans: ['Inter', 'sans-serif'],
                },
                colors: {
                  pumphouse: {
                    bg: '#F9F8F6',
                    charcoal: '#1A1A1A',
                    navy: '#2C3E50',
                    taupe: '#E5E0DA',
                    gold: '#C5A059'
                  }
                }
              }
            }
          };
        }
      });
    </script>
    <style>
      body {
        background-color: #F9F8F6;
        color: #1A1A1A;
        -webkit-font-smoothing: antialiased;
      }
      .hover-underline-animation {
        display: inline-block;
        position: relative;
        color: inherit;
      }
      .hover-underline-animation::after {
        content: '';
        position: absolute;
        width: 100%;
        transform: scaleX(0);
        height: 1px;
        bottom: -2px;
        left: 0;
        background-color: currentColor;
        transform-origin: bottom right;
        transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .hover-underline-animation:hover::after {
        transform: scaleX(1);
        transform-origin: bottom left;
      }

      /* ---- Smooth scrolling ---- */
      html {
        scroll-behavior: smooth;
        /* keep anchored targets clear of the fixed header */
        scroll-padding-top: 110px;
      }

      /* ---- Scroll reveal ----
         Styles are scoped to .reveal-ready, which ScrollReveal adds only when
         JS runs and motion is allowed. Without it everything stays visible. */
      .reveal-ready [data-reveal],
      .reveal-ready [data-reveal-group] > * {
        opacity: 0;
        transform: translateY(26px);
        transition: opacity 850ms cubic-bezier(0.25, 0.46, 0.45, 0.94),
                    transform 850ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      .reveal-ready [data-reveal].is-revealed,
      .reveal-ready [data-reveal-group].is-revealed > * {
        opacity: 1;
        transform: none;
      }

      /* Cascade the children of a group */
      .reveal-ready [data-reveal-group].is-revealed > *:nth-child(1)  { transition-delay: 0ms; }
      .reveal-ready [data-reveal-group].is-revealed > *:nth-child(2)  { transition-delay: 90ms; }
      .reveal-ready [data-reveal-group].is-revealed > *:nth-child(3)  { transition-delay: 180ms; }
      .reveal-ready [data-reveal-group].is-revealed > *:nth-child(4)  { transition-delay: 270ms; }
      .reveal-ready [data-reveal-group].is-revealed > *:nth-child(5)  { transition-delay: 360ms; }
      .reveal-ready [data-reveal-group].is-revealed > *:nth-child(6)  { transition-delay: 450ms; }
      .reveal-ready [data-reveal-group].is-revealed > *:nth-child(7)  { transition-delay: 540ms; }
      .reveal-ready [data-reveal-group].is-revealed > *:nth-child(8)  { transition-delay: 630ms; }
      .reveal-ready [data-reveal-group].is-revealed > *:nth-child(n+9) { transition-delay: 720ms; }

      /* A slower, gentler rise for large imagery */
      .reveal-ready [data-reveal="image"] {
        transform: translateY(34px) scale(1.015);
        transition-duration: 1100ms;
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .reveal-ready [data-reveal],
        .reveal-ready [data-reveal-group] > * {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
